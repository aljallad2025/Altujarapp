workflows:
  altujar-android:
    name: Altujar Android Build
    max_build_duration: 60
    environment:
      flutter: stable
    scripts:
      - name: Generate platform folders
        script: flutter create . --platforms=android,ios --org com.altujar --project-name altujar_app
      - name: Get Flutter packages
        script: flutter pub get
      - name: Build APK
        script: flutter build apk --release
    artifacts:
      - build/**/outputs/**/*.apk
